{% extends 'layout.html' %}

{% block title %}
RweetBlog
{% endblock %}

{% block content %}
<h1 class="text-center mt-4">Rweet</h1>

<div class="text-center mb-4">
    <a class="btn btn-primary" href="{% url 'tweet_create' %}">Create a Rweet</a>
</div>

<div class="container">
    <div class="row justify-content-center">
        {% for tweet in tweets %}
            <div class="col-sm-10 col-md-6 col-lg-4 d-flex align-items-stretch mb-4">
                <div class="card w-100 shadow-sm">
                    {% if tweet.photo %}
                        <img src="{{ tweet.photo.url }}" class="card-img-top img-fluid" alt="Tweet Image">
                    {% endif %}
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{ tweet.user.username }}</h5>
                        <p class="card-text">{{ tweet.text }}</p>
                        {% if tweet.user == user %}
                            <div class="mt-auto d-flex justify-content-between">
                                <a href="{% url 'tweet_edit' tweet.id %}" class="btn btn-primary btn-sm">Edit</a>
                                <a href="{% url 'tweet_delete' tweet.id %}" class="btn btn-danger btn-sm">Delete</a>
                            </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
