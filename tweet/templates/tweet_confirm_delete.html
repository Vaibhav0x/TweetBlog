{% extends 'layout.html' %}

{% block title %}
RweetBlog
{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card p-4 shadow-sm w-100" style="max-width: 500px;">
        <h3 class="text-center mb-4">Are you sure you want to delete this tweet?</h3>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-between">
                <button class="btn btn-danger">Delete</button>
                <a class="btn btn-success" href="{% url 'tweet_list' %}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
