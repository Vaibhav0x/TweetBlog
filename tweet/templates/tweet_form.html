{% extends 'layout.html' %}

{% block title %}
RweetBlog
{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="text-center mt-4">Rweet</h1>
    
    <div class="text-center mb-4">
        <h3>
            {% if form.instance.pk %} 
                Edit Rweet 
            {% else %} 
                Create Rweet
            {% endif %}
        </h3>
    </div>

    <div class="d-flex justify-content-center">
        <form method="post" enctype="multipart/form-data" class="w-100" style="max-width: 600px;">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.as_p }}
            </div>

            <div class="d-grid gap-2 col-12 mx-auto">
                <button class="btn btn-warning mb-3" type="submit">Submit</button>
            </div>
        </form>
    </div>
    
    <div class="text-center mt-3">
        <a href="{% url 'tweet_list' %}" class="text-decoration-none">Back to Tweets</a>
    </div>
</div>
{% endblock %}
